name: Publish package to npm

on:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: npm-publish-stable
    cancel-in-progress: false

jobs:
    publish:
        name: Build and publish
        if: github.repository == 'rkstraessler/ReikemMailClient_TS'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Validate release tag and derive package version
              id: release
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]] ||
                      [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo '::error title=Invalid release tag::Expected a tag of the form vMAJOR.MINOR.PATCH.'
                      exit 1
                  fi
                  printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Check out the exact release commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify the release tag and main ancestry
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
                  no-cache: true

            - name: Set up Node.js and npm registry
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install locked dependencies and check for vulnerabilities
              run: |
                  bun --no-env-file install --frozen-lockfile --ignore-scripts
                  bun --no-env-file audit --audit-level=high

            - name: Run checks and build
              run: bun --no-env-file run check

            - name: Set package version from release tag
              env:
                  PACKAGE_VERSION: ${{ steps.release.outputs.version }}
              run: npm version "$PACKAGE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version

            - name: Publish the verified build
              run: npm publish --access public --ignore-scripts

    banner:
        name: Add release banner
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Check out the published source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
                  no-cache: true

            - name: Attach verified artwork and update banner in the notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  RELEASE_ID: ${{ github.event.release.id }}
              run: bun --no-env-file .github/scripts/release/banner.ts "$RELEASE_TAG"
