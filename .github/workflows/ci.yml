name: CI

on:
    pull_request:
        branches: [main]
        types: [opened, reopened, synchronize, ready_for_review]
    push:
        branches: [main]
    schedule:
        - cron: '45 4 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    package:
        name: Package checks
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out the commit under test
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - name: Restore Bun download cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ci-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock', 'bunfig.toml') }}

            - name: Install locked dependencies without lifecycle scripts
              run: bun --no-env-file install --frozen-lockfile --ignore-scripts

            - name: Check types, lint, formatting, tests, build and package contents
              env:
                  FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: bun --no-env-file run check

            - name: Validate GitHub workflows
              env:
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  set -euo pipefail
                  archive="$RUNNER_TEMP/actionlint.tar.gz"
                  curl --fail --silent --show-error --location --proto '=https' --output "$archive" \
                      'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
                  printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
                  tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
                  "$RUNNER_TEMP/actionlint"

    security:
        name: Dependency security
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out locked dependencies
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - name: Audit the Bun lockfile
              run: bun --no-env-file audit --audit-level=high

            - name: Review incoming dependencies and Actions
              if: github.event_name == 'pull_request'
              uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  fail-on-severity: high
