name: PR maintenance

on:
    pull_request_target:
        branches: [main]
        types: [opened, reopened, synchronize, ready_for_review, edited]
    workflow_run:
        workflows: [CI]
        types: [completed]
    push:
        branches: [main]
    schedule:
        - cron: '13,43 * * * *'
    workflow_dispatch:

permissions: {}

jobs:
    metadata:
        name: Label update and autofix PRs
        if: >-
            github.repository == 'rkstraessler/ReikemMailClient_TS' &&
            github.event_name == 'pull_request_target' &&
            (github.event.pull_request.user.login == 'dependabot[bot]' ||
             github.actor == 'autofix-ci[bot]')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        concurrency:
            group: dependabot-metadata-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Check out trusted base automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
                  no-cache: true

            - name: Apply labels from verified update metadata
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
                  MERGE_APP_SLUG: ${{ vars.DEPENDABOT_APP_SLUG }}
              run: bun --no-env-file .github/scripts/security/dependabot.ts label

    reconcile:
        name: Maintain open pull requests
        if: >-
            github.repository == 'rkstraessler/ReikemMailClient_TS' &&
            github.ref == 'refs/heads/main' &&
            github.event_name != 'pull_request_target' &&
            vars.DEPENDABOT_APP_CLIENT_ID != '' &&
            vars.DEPENDABOT_APP_SLUG != '' &&
            (github.event_name != 'workflow_run' ||
             (github.event.workflow_run.event == 'pull_request' &&
              github.event.workflow_run.head_repository.full_name == github.repository))
        environment: dependabot
        concurrency:
            group: dependabot-reconcile-main
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
            pull-requests: read
        steps:
            - name: Check out trusted main automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/heads/main
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json
                  no-cache: true

            - name: Create a repository-scoped GitHub App token
              id: app
              uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
              with:
                  client-id: ${{ vars.DEPENDABOT_APP_CLIENT_ID }}
                  private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ${{ github.event.repository.name }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-workflows: write

            - name: Update branches and reconcile Dependabot pull requests
              env:
                  GH_TOKEN: ${{ github.token }}
                  MERGE_APP_TOKEN: ${{ steps.app.outputs.token }}
                  MERGE_APP_SLUG: ${{ vars.DEPENDABOT_APP_SLUG }}
              run: bun --no-env-file .github/scripts/security/dependabot.ts reconcile
