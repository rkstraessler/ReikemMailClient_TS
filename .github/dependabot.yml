version: 2

updates:
    # The Bun updater tracks npm dependencies in package.json and updates bun.lock.
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: daily
          time: '03:00'
          timezone: Europe/Berlin
      cooldown:
          default-days: 1
      open-pull-requests-limit: 4
      labels: [dependencies, typescript]
      commit-message:
          prefix: 'chore(deps)'
      groups:
          routine-updates:
              applies-to: version-updates
              patterns: ['*']
              update-types: [minor, patch]
          security-updates:
              applies-to: security-updates
              patterns: ['*']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: daily
          time: '03:00'
          timezone: Europe/Berlin
      cooldown:
          default-days: 1
      open-pull-requests-limit: 3
      labels: [dependencies, github-actions]
      commit-message:
          prefix: 'ci(deps)'
      groups:
          routine-actions:
              applies-to: version-updates
              patterns: ['*']
              update-types: [minor, patch]
          security-actions:
              applies-to: security-updates
              patterns: ['*']
